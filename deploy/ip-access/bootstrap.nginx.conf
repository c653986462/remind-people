# Managed IP access for certificate-manager.
# Only enable the ACME challenge endpoint until a trusted IP certificate exists.
server {
    listen 80;
    server_name 124.221.168.72;
    server_tokens off;

    access_log /var/log/nginx/certificate-manager-ip.access.log;
    error_log /var/log/nginx/certificate-manager-ip.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certificate-manager-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "IP HTTPS setup is in progress.\n";
    }
}
