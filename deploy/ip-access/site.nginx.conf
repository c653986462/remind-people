# Managed IP access for certificate-manager.
limit_req_zone $binary_remote_addr zone=certificate_ip_login:10m rate=5r/m;

server {
    listen 80;
    server_name 124.221.168.72;
    server_tokens off;
    access_log /var/log/nginx/certificate-manager-ip.access.log;
    error_log /var/log/nginx/certificate-manager-ip.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certificate-manager-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://124.221.168.72$request_uri;
    }
}

server {
    # Browsers normally omit TLS SNI for IP URLs. The IP certificate must be
    # the default on port 443; the existing domain still selects its own SNI site.
    listen 443 ssl default_server;
    server_name 124.221.168.72;
    server_tokens off;
    root /opt/certificate-manager/frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt-ip/live/certificate-manager-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-ip/live/certificate-manager-ip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/certificate-manager-ip.access.log;
    error_log /var/log/nginx/certificate-manager-ip.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location = /api/auth/login {
        limit_req zone=certificate_ip_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /opt/certificate-manager/deploy/desktop-updates.nginx.conf;
}
