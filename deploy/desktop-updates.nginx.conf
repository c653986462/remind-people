# Place this location block inside the HTTPS server block for the desktop app domain.
# Upload .exe, .blockmap, and latest.yml files into this directory; upload latest.yml last.
location ^~ /desktop-updates/ {
    alias /opt/certificate-manager/desktop-updates/;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
