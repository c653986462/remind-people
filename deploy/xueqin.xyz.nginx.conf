# Install into /etc/nginx/sites-available/certificate-manager and enable it.
# Ubuntu includes this file in the nginx http context.
# After checking HTTP access, use Certbot's nginx plugin to enable HTTPS.
limit_req_zone $binary_remote_addr zone=certificate_login:10m rate=5r/m;

server {
    listen 80;
    server_name xueqin.xyz;
    root /opt/certificate-manager/frontend/dist;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location = /api/auth/login {
        limit_req zone=certificate_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /opt/certificate-manager/deploy/desktop-updates.nginx.conf;
}
