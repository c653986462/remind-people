name: Test, build and deploy all components

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      DATABASE_URL: sqlite://
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_SMTP_HOST: ''
      EMAIL_SMTP_USERNAME: ''
      EMAIL_SMTP_PASSWORD: ''
      WECHAT_WORK_WEBHOOK_URL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python deploy/test_verify_full_release.py
      - run: python deploy/ci/test_ci_deploy.py
      - name: Check deployment shell syntax
        if: runner.os == 'Linux'
        run: find deploy -name '*.sh' -print0 | xargs -0 -n1 bash -n

  build:
    name: Build web and Windows installer
    needs: test
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Assign an automatic release version
        id: version
        run: node deploy/ci-version.cjs
      - name: Test automatic versioning
        run: node --test deploy/ci/test-ci-version.cjs
      - name: Build every component into one verified package
        run: ./deploy/build-full-release.ps1 -PythonExecutable python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-release-${{ steps.version.outputs.version }}
          path: |
            deploy/packages/certificate-manager-full-*.tar.gz
            deploy/packages/certificate-manager-full-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  deploy:
    name: Deploy backend, web, website and desktop
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: certificate-manager-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL || 'https://124.221.168.72' }}
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: full-release-${{ needs.build.outputs.version }}
          path: release-artifact
      - name: Ensure resumable transfer is available
        run: |
          if ! command -v rsync >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
      - name: Upload and deploy using a restricted server account
        run: bash deploy/ci/deploy-from-actions.sh
      - name: Verify the public website and desktop version
        run: |
          set -euo pipefail
          [[ "$PUBLIC_URL" == https://* ]] || { echo 'Public URL must use HTTPS.'; exit 1; }
          curl --noproxy '*' --retry 3 --connect-timeout 10 --max-time 30 -fsS "$PUBLIC_URL/" -o /dev/null
          curl --noproxy '*' --retry 3 --connect-timeout 10 --max-time 30 -fsS "$PUBLIC_URL/desktop-updates/latest.yml" | grep -Fx "version: $EXPECTED_VERSION"
          printf 'Published version %s from commit %s\n' "$EXPECTED_VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
